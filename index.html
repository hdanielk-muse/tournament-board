<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<title>골프 대회 순위표</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;min-height:100vh;padding:12px;max-width:640px;margin:0 auto}
h1{font-size:20px;text-align:center;margin:8px 0 4px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:14px}
.section{background:#161b22;border:1px solid #2a2f3a;border-radius:12px;padding:14px;margin-bottom:12px}
.section h2{font-size:16px;margin-bottom:10px}
textarea{width:100%;height:120px;font-size:15px;padding:10px;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff;resize:vertical}
.btn{width:100%;padding:14px;font-size:16px;font-weight:700;border:none;border-radius:10px;background:#1f6feb;color:#fff;cursor:pointer;margin-top:10px}
.btn:active{transform:scale(.98)}
.btn.danger{background:#3a1a1a;border:1px solid #6b2222;color:#ff7b72}
.btn.small{width:auto;padding:8px 16px;font-size:14px;margin-top:0}
.btn.green{background:#1a6b2a}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:10px 6px;border-bottom:1px solid #2a2f3a;text-align:center}
th{color:#888;font-size:13px;position:sticky;top:0;background:#161b22}
td.name{text-align:left;font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input.score{width:64px;font-size:17px;padding:10px 4px;text-align:center;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff}
.total{font-weight:900;font-size:17px}
.under{color:#7ee787;font-weight:900}
.over{color:#ff7b72;font-weight:900}
.even{color:#aaa;font-weight:900}
.rank-1{background:#3a2f0a}.rank-2{background:#2a2f3a}.rank-3{background:#2a1f0f}
.rank-badge{display:inline-block;min-width:34px;padding:4px 8px;border-radius:8px;font-weight:900}
.r1{background:#ffd700;color:#000}.r2{background:#c0c0c0;color:#000}.r3{background:#cd7f32;color:#000}.rx{background:#2a2f3a;color:#fff}
.del{background:none;border:none;color:#666;font-size:18px;cursor:pointer;padding:4px}
#count{text-align:center;color:#888;font-size:14px;margin-bottom:8px}
#err,#ok{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:15px;display:none;z-index:20;max-width:90vw}
#err{background:#6b2222}#ok{background:#1a6b2a}
.empty{text-align:center;color:#666;padding:30px;font-size:15px}
.hist-row{display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid #2a2f3a;font-size:14px}
.hist-row .t{flex:1}
.hist-row .c{color:#888;font-size:13px}
</style>
</head>
<body>
<h1>🏆 골프 대회 순위표</h1>
<div class="sub" id="mode-sub">스크린 + 필드 합산</div>

<div class="section">
<div style="display:flex;gap:8px;margin-bottom:10px">
<input id="event-date" type="date" style="flex:1;font-size:15px;padding:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff;color-scheme:dark">
</div>
<input id="event-course" placeholder="골프장 이름 (예: Pelham Hills)" style="width:100%;font-size:15px;padding:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff">
</div>

<div class="section">
<div style="display:flex;gap:8px">
<button id="mode-screen" class="btn small" style="flex:1;background:#2a2f3a" onclick="setMode('screen')">스크린</button>
<button id="mode-field" class="btn small" style="flex:1;background:#2a2f3a" onclick="setMode('field')">필드</button>
<button id="mode-both" class="btn small" style="flex:1" onclick="setMode('both')">스크린+필드</button>
</div>
<div style="color:#888;font-size:13px;margin-top:10px">점수는 언더/오버로 입력 (예: -3, E는 0, +2는 2)</div>
</div>

<div class="section">
<h2>참가자 등록</h2>
<textarea id="names-input" placeholder="한 줄에 한 명씩 붙여넣기&#10;예:&#10;김철수&#10;이영희&#10;박민수"></textarea>
<button class="btn" onclick="addBulk()">일괄 등록</button>
<div style="display:flex;gap:8px;margin-top:10px">
<input id="name-one" placeholder="이름" style="flex:1;font-size:15px;padding:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff">
<button class="btn small" onclick="addOne()">추가</button>
</div>
</div>

<div id="count"></div>
<div class="section" style="padding:10px">
<div style="display:flex;gap:8px;margin-bottom:10px">
<input id="search" placeholder="🔍 이름 검색" oninput="applySearch()" style="flex:1;font-size:15px;padding:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0d1117;color:#fff">
<button id="sort-btn" class="btn small" style="white-space:nowrap" onclick="toggleSort()">이름순</button>
</div>
<table>
<thead><tr></tr></thead>
<tbody id="tbody"></tbody>
</table>
<div id="empty" class="empty">참가자를 등록해줘</div>
</div>

<div class="section">
<h2>📥 엑셀 저장</h2>
<button class="btn green" onclick="exportCurrent()">지금 순위표 엑셀로 저장</button>
<button class="btn" onclick="saveTournament()">💾 이 대회 기록으로 저장</button>
<button class="btn" onclick="exportSeason()">📊 시즌 누적 엑셀로 저장</button>
</div>

<div class="section">
<h2>📚 저장된 대회 기록 <span id="hist-count" style="color:#888;font-size:13px"></span></h2>
<div id="hist-list"><div class="empty" style="padding:16px">저장된 기록이 없어</div></div>
<button class="btn danger" onclick="clearHistory()">저장된 기록 전체 삭제</button>
</div>

<div class="section">
<button class="btn danger" onclick="clearAll()">🗑 현재 명단 전체 삭제</button>
</div>

<div id="err"></div><div id="ok"></div>
<script>
const LS_KEY="tournament-scores-v1";
const MODE_KEY="tournament-mode-v1";
const EVENT_KEY="tournament-event-v1";
const HIST_KEY="tournament-history-v1";
let players=[]; // {id,name,screen,field} — 점수는 언더/오버 숫자 (음수 가능)
let mode="both"; // screen | field | both
let sortBy="rank"; // rank | name
let searchQuery="";
let history=[]; // {id,date,course,mode,results:[{name,screen,field,total,rank}]}

function load(){try{const s=localStorage.getItem(LS_KEY);if(s)players=JSON.parse(s);}catch(e){players=[];}try{const m=localStorage.getItem(MODE_KEY);if(m&&["screen","field","both"].includes(m))mode=m;}catch(e){}try{const h=localStorage.getItem(HIST_KEY);if(h)history=JSON.parse(h);}catch(e){history=[];}}
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(players));}catch(e){}}
function saveMode(){try{localStorage.setItem(MODE_KEY,mode);}catch(e){}}
function saveHistory(){try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}}
function setMode(m){mode=m;saveMode();updateHeader();render();}
function toggleSort(){sortBy=sortBy==="rank"?"name":"rank";render();}
function applySearch(){
 searchQuery=document.getElementById("search").value.trim();
 const rows=document.querySelectorAll("#tbody tr");
 rows.forEach(tr=>{
  const nameInput=tr.querySelector('input.name-input');
  const name=nameInput?nameInput.value:"";
  tr.style.display=(!searchQuery||name.includes(searchQuery))?"":"none";
 });
}
function saveEvent(){
 try{
  localStorage.setItem(EVENT_KEY,JSON.stringify({
   date:document.getElementById("event-date").value,
   course:document.getElementById("event-course").value
  }));
 }catch(e){}
 updateHeader();
}
function loadEvent(){
 try{
  const s=localStorage.getItem(EVENT_KEY);
  if(s){const e=JSON.parse(s);
   document.getElementById("event-date").value=e.date||"";
   document.getElementById("event-course").value=e.course||"";
  }
 }catch(e){}
 updateHeader();
}
function modeLabel(){return mode==="both"?"스크린 + 필드 합산":mode==="screen"?"스크린 점수":"필드 점수";}
function updateHeader(){
 const d=document.getElementById("event-date").value;
 const c=document.getElementById("event-course").value.trim();
 let parts=[];
 if(d)parts.push(d);
 if(c)parts.push(c);
 document.getElementById("mode-sub").textContent=(parts.length?parts.join(" · ")+" — ":"")+modeLabel();
}
function showErr(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block";clearTimeout(showErr.t);showErr.t=setTimeout(()=>e.style.display="none",2500);}
function showOk(m){const e=document.getElementById("ok");e.textContent=m;e.style.display="block";clearTimeout(showOk.t);showOk.t=setTimeout(()=>e.style.display="none",3000);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

// 점수 표시: -3 → "-3", 0 → "E", 2 → "+2"
function fmt(v){
 if(v==null||isNaN(v))return "-";
 if(v<0)return String(v);
 if(v===0)return "E";
 return "+"+v;
}
function fmtCls(v){
 if(v==null||isNaN(v))return "";
 if(v<0)return "under";
 if(v===0)return "even";
 return "over";
}

function addBulk(){
 const text=document.getElementById("names-input").value;
 const names=text.split("\n").map(n=>n.trim()).filter(n=>n);
 if(!names.length){showErr("이름을 입력해줘");return;}
 const existing=new Set(players.map(p=>p.name));
 let added=0;
 names.forEach(n=>{if(!existing.has(n)){players.push({id:uid(),name:n,screen:null,field:null});existing.add(n);added++;}});
 document.getElementById("names-input").value="";
 save();render();showOk(added+"명 등록됨");
}
function addOne(){
 const n=document.getElementById("name-one").value.trim();
 if(!n){showErr("이름을 입력해줘");return;}
 if(players.some(p=>p.name===n)){showErr("이미 있어");return;}
 players.push({id:uid(),name:n,screen:null,field:null});
 document.getElementById("name-one").value="";
 save();render();showOk(n+" 등록됨");
}
function delPlayer(id){
 players=players.filter(p=>p.id!==id);
 save();render();
}
function setName(id,val){
 const p=players.find(x=>x.id===id);if(!p)return;
 const n=val.trim();if(!n)return;
 p.name=n;save();render();
}
function setScore(id,which,val){
 const p=players.find(x=>x.id===id);if(!p)return;
 const t=String(val).trim().toUpperCase();
 if(t===""||t==="E"){p[which]=null;save();render();return;}
 const v=parseInt(t,10);
 if(isNaN(v)||v<-99||v>99){showErr("숫자로 입력해줘 (-99~99)");render();return;}
 p[which]=v;
 save();render();
}
function total(p){
 if(mode==="screen")return p.screen;
 if(mode==="field")return p.field;
 if(p.screen==null||p.field==null)return null;
 return p.screen+p.field;
}
function computeRanks(){
 const ranked=[...players].sort((a,b)=>{
  const ta=total(a),tb=total(b);
  if(ta==null&&tb==null)return 0;
  if(ta==null)return 1;if(tb==null)return -1;
  return ta-tb;
 });
 const rankMap={};let prevTotal=null,prevRank=0;
 ranked.forEach((p,i)=>{
  const t=total(p);
  if(t==null){rankMap[p.id]="-";}
  else if(t===prevTotal){rankMap[p.id]=prevRank;}
  else{rankMap[p.id]=i+1;prevTotal=t;prevRank=i+1;}
 });
 return rankMap;
}
function clearAll(){
 if(!players.length)return;
 if(!confirm("현재 명단을 전부 지울까? (저장된 대회 기록은 유지돼)"))return;
 players=[];save();render();
}
function rankBadge(rank){
 if(rank===1)return '<span class="rank-badge r1">1</span>';
 if(rank===2)return '<span class="rank-badge r2">2</span>';
 if(rank===3)return '<span class="rank-badge r3">3</span>';
 return '<span class="rank-badge rx">'+rank+'</span>';
}
function headHTML(){
 if(mode==="both")return '<th>순위</th><th style="text-align:left">이름</th><th>스크린</th><th>필드</th><th>합계</th><th></th>';
 if(mode==="screen")return '<th>순위</th><th style="text-align:left">이름</th><th>스크린</th><th>점수</th><th></th>';
 return '<th>순위</th><th style="text-align:left">이름</th><th>필드</th><th>점수</th><th></th>';
}
function scoreInput(p,which){
 const v=p[which];
 // type="number"는 폰 키보드에 마이너스 키가 안 떠서 type="text"+inputmode="decimal" 사용
 return `<input class="score" type="text" inputmode="decimal" placeholder="0" value="${v??""}" onchange="setScore('${p.id}','${which}',this.value)">`;
}
function render(){
 ["screen","field","both"].forEach(m=>{
  document.getElementById("mode-"+m).style.background=mode===m?"#1f6feb":"#2a2f3a";
 });
 document.getElementById("sort-btn").textContent=sortBy==="rank"?"이름순":"순위순";
 searchQuery=document.getElementById("search").value.trim();
 const thead=document.querySelector("thead tr");
 const wantHead=headHTML();
 if(thead.innerHTML!==wantHead)thead.innerHTML=wantHead;
 const tb=document.getElementById("tbody");
 document.getElementById("count").textContent=players.length?`참가자 ${players.length}명`:"";
 document.getElementById("empty").style.display=players.length?"none":"block";
 if(!players.length){tb.innerHTML="";return;}
 const rankMap=computeRanks();
 let shown=players.filter(p=>!searchQuery||p.name.includes(searchQuery));
 if(sortBy==="name"){shown=[...shown].sort((a,b)=>a.name.localeCompare(b.name,"ko"));}
 else{shown=[...shown].sort((a,b)=>{
  const ra=rankMap[a.id],rb=rankMap[b.id];
  if(ra==="-"&&rb==="-")return a.name.localeCompare(b.name,"ko");
  if(ra==="-")return 1;if(rb==="-")return -1;
  return ra-rb;
 });}
 let html="";
 shown.forEach(p=>{
  const t=total(p);
  const rank=rankMap[p.id];
  const rowCls=rank===1?"rank-1":rank===2?"rank-2":rank===3?"rank-3":"";
  let mid="";
  if(mode==="both")mid=`<td>${scoreInput(p,"screen")}</td><td>${scoreInput(p,"field")}</td>`;
  else if(mode==="screen")mid=`<td>${scoreInput(p,"screen")}</td>`;
  else mid=`<td>${scoreInput(p,"field")}</td>`;
  html+=`<tr class="${rowCls}">`
   +`<td>${rank==="-"?"-":rankBadge(rank)}</td>`
   +`<td><input class="score name-input" type="text" style="width:90px;font-size:15px" value="${esc(p.name)}" onchange="setName('${p.id}',this.value)"></td>`
   +mid
   +`<td class="total ${fmtCls(t)}">${fmt(t)}</td>`
   +`<td><button class="del" onclick="delPlayer('${p.id}')">×</button></td>`
   +`</tr>`;
 });
 tb.innerHTML=html;
 if(searchQuery)applySearch();
 renderHistory();
}

// ---------- 엑셀(CSV) 저장 ----------
function csvEsc(v){
 const s=String(v??"");
 return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function downloadCSV(name,rows){
 const csv="\uFEFF"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(blob);
 a.download=name;
 document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function eventInfo(){
 return {
  date:document.getElementById("event-date").value||"",
  course:document.getElementById("event-course").value.trim()||""
 };
}
function fileBase(){
 const e=eventInfo();
 const d=e.date||"nodate";
 const c=e.course? "_"+e.course.replace(/[\\/:*?"<>|]/g,""):"";
 return "순위표_"+d+c;
}
function exportCurrent(){
 if(!players.length){showErr("명단이 비어 있어");return;}
 const e=eventInfo();
 const rankMap=computeRanks();
 const ranked=[...players].sort((a,b)=>{
  const ra=rankMap[a.id],rb=rankMap[b.id];
  if(ra==="-"&&rb==="-")return a.name.localeCompare(b.name,"ko");
  if(ra==="-")return 1;if(rb==="-")return -1;
  return ra-rb;
 });
 const rows=[];
 rows.push(["날짜",e.date]);
 rows.push(["골프장",e.course]);
 rows.push(["모드",modeLabel()]);
 rows.push([]);
 if(mode==="both")rows.push(["순위","이름","스크린","필드","합계"]);
 else if(mode==="screen")rows.push(["순위","이름","스크린"]);
 else rows.push(["순위","이름","필드"]);
 ranked.forEach(p=>{
  const r=rankMap[p.id];
  if(mode==="both")rows.push([r==="-"?"-":r,p.name,fmt(p.screen),fmt(p.field),fmt(total(p))]);
  else if(mode==="screen")rows.push([r==="-"?"-":r,p.name,fmt(p.screen)]);
  else rows.push([r==="-"?"-":r,p.name,fmt(p.field)]);
 });
 downloadCSV(fileBase()+".csv",rows);
 showOk("엑셀 파일 저장됨");
}

// ---------- 대회 기록 저장 / 시즌 누적 ----------
function saveTournament(){
 if(!players.length){showErr("명단이 비어 있어");return;}
 const e=eventInfo();
 const rankMap=computeRanks();
 const results=players.map(p=>({
  name:p.name,
  screen:p.screen,field:p.field,
  total:total(p),
  rank:rankMap[p.id]
 }));
 history.unshift({
  id:uid(),date:e.date,course:e.course,mode:modeLabel(),
  count:players.length,results:results,savedAt:new Date().toISOString()
 });
 saveHistory();renderHistory();
 showOk("대회 기록 저장됨 ("+history.length+"개)");
}
function delHistory(id){
 history=history.filter(h=>h.id!==id);
 saveHistory();renderHistory();
}
function clearHistory(){
 if(!history.length)return;
 if(!confirm("저장된 대회 기록을 전부 지울까?"))return;
 history=[];saveHistory();renderHistory();
}
function renderHistory(){
 const box=document.getElementById("hist-list");
 document.getElementById("hist-count").textContent=history.length?`(${history.length}개)`:"";
 if(!history.length){box.innerHTML='<div class="empty" style="padding:16px">저장된 기록이 없어</div>';return;}
 box.innerHTML=history.map(h=>{
  const d=h.date||"날짜 없음";
  const c=h.course?` · ${esc(h.course)}`:"";
  return `<div class="hist-row"><div class="t">${esc(d)}${c}<div class="c">${esc(h.mode)} · ${h.count}명</div></div><button class="del" onclick="delHistory('${h.id}')">×</button></div>`;
 }).join("");
}
function exportSeason(){
 if(!history.length){showErr("저장된 대회 기록이 없어");return;}
 const ordered=[...history].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
 // 이름별 집계
 const agg={}; // name -> {rounds, sum, per:{histId: total}}
 ordered.forEach(h=>{
  h.results.forEach(r=>{
   if(r.total==null)return;
   if(!agg[r.name])agg[r.name]={rounds:0,sum:0,per:{}};
   agg[r.name].rounds++;
   agg[r.name].sum+=r.total;
   agg[r.name].per[h.id]=r.total;
  });
 });
 const names=Object.keys(agg).sort((a,b)=>agg[a].sum-agg[b].sum);
 const rows=[];
 rows.push(["이름","참가 횟수","시즌 합계","평균"].concat(ordered.map(h=>(h.date||"").slice(5)+" "+(h.course||""))));
 names.forEach(n=>{
  const a=agg[n];
  const avg=(a.sum/a.rounds).toFixed(1);
  rows.push([n,a.rounds,fmt(a.sum),avg].concat(ordered.map(h=>fmt(a.per[h.id]??null))));
 });
 downloadCSV("시즌누적_순위표.csv",rows);
 showOk("시즌 누적 엑셀 저장됨");
}

load();loadEvent();render();
document.getElementById("event-date").addEventListener("change",saveEvent);
document.getElementById("event-course").addEventListener("change",saveEvent);
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
